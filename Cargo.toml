[workspace]
resolver = "2"
members = [
    "crates/coc-data",
    "crates/coc-assets",
    "crates/coc-core",
    "crates/coc-sim",
    "crates/coc-meta",
    "crates/coc-opt",
    "crates/coc-render",
    "crates/coc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
coc-data = { path = "crates/coc-data" }
coc-assets = { path = "crates/coc-assets" }
coc-core = { path = "crates/coc-core" }
coc-sim = { path = "crates/coc-sim" }
coc-meta = { path = "crates/coc-meta" }
coc-opt = { path = "crates/coc-opt" }
coc-render = { path = "crates/coc-render" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
lzma-rs = "0.3"
zstd = "0.13"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
